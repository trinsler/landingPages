# Redis configuration for Imagio Scale
# Optimized for performance and scale

# Memory and performance settings
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (for rate limiting data)
save 60 1000
stop-writes-on-bgsave-error yes
rdbcompression yes

# Network settings
tcp-keepalive 300
timeout 0

# Security
requirepass imagio_redis_123

# Logging
loglevel notice
logfile ""

# Performance optimizations
tcp-nodelay yes
databases 16

# Rate limiting specific settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Connection limits
maxclients 1000