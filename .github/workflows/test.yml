name: 🧪 Tests & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    # Test ALL pull requests to main (from any branch)
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    # Also handle external PRs (like Renovate from forks)
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    # Allow manual triggering
  schedule:
    # Run weekly dependency checks on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔍 TypeScript Check
        run: pnpm run typecheck

      - name: 🧹 Lint & Format Check
        run: |
          pnpm run lint
          pnpm run format:check

      - name: 🧪 Run Build Tests
        run: pnpm run test:build

      - name: 🧩 Run Component Tests
        run: |
          pnpm --filter=@monorepo/ui vitest run
          pnpm --filter=@monorepo/shared vitest run

      - name: 🏗️ Build All Apps
        run: |
          pnpm --filter=@monorepo/trinsler run build
          pnpm --filter=@monorepo/betterclassroom run build
          pnpm --filter=@monorepo/coin-boilerplate-app run build

      - name: 📊 Upload Build Artifacts
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            apps/*/dist
            apps/*/.output
          retention-days: 7

  # Deploy after successful tests (only on main branch)
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🏗️ Build packages
        run: pnpm run build:packages

      - name: 🏗️ Build Coin app for production
        run: pnpm --filter=@monorepo/coin-boilerplate-app run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          NODE_ENV: production
          NUXT_APP_ENV: production

      - name: 🏗️ Build Trinsler app for development
        run: pnpm --filter=@monorepo/trinsler run generate
        env:
          NODE_ENV: development
          NUXT_APP_ENV: develop

      - name: 🚀 Deploy Coin app
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/coin
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/coin-boilerplate-app/.output/public
          cname: coin.trinsler.com

      - name: 🚀 Deploy Trinsler app to Development
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/trinsler-develop
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/trinsler/.output/public
          cname: trinsler-develop.trinsler.com

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Live URLs:**" >> $GITHUB_STEP_SUMMARY
            echo "- [Coin App](https://coin.trinsler.com)" >> $GITHUB_STEP_SUMMARY
            echo "- [Trinsler Dev](https://trinsler-develop.trinsler.com)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed!**" >> $GITHUB_STEP_SUMMARY
          fi

  lighthouse:
    name: 🏠 Lighthouse Performance Check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🏗️ Build Trinsler App (for Lighthouse)
        run: pnpm --filter=@monorepo/trinsler run build

      - name: 🚀 Start server for Lighthouse
        run: |
          cd apps/trinsler
          node .output/server/index.mjs &
          sleep 10

      - name: 🏠 Run Lighthouse CI
        run: |
          npm install -g lighthouse
          lighthouse http://localhost:3000 --output json --output-path lighthouse-report.json --chrome-flags="--headless --no-sandbox" || true

      - name: 📊 Parse Lighthouse Results
        run: |
          echo "## 🏠 Lighthouse Performance Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f lighthouse-report.json ]; then
            echo "| Metric | Score | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY

            # Parse JSON with jq or python
            python3 -c "
import json
import sys

try:
    with open('lighthouse-report.json', 'r') as f:
        report = json.load(f)

    categories = report['lhr']['categories']

    for key, category in categories.items():
        score = round(category['score'] * 100)
        status = '🟢' if score >= 90 else '🟡' if score >= 70 else '🔴'
        print(f\"| {category['title']} | {score} | {status} |\")

except Exception as e:
    print('| Error | - | 🔴 |')
    print(f'| Failed to parse: {e} | - | - |')
            " >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Full report available in artifacts**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lighthouse report not generated**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 30