name: 🧪 Tests & Quality Checks

on:
  push:
    branches: [main, develop]
    tags: ['v*']  # Production deployment on version tags
  pull_request:
    # Test ALL pull requests to main (from any branch)
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    # Also handle external PRs (like Renovate from forks)
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔍 TypeScript Check
        run: pnpm run typecheck

      - name: 🧹 Lint & Format Check
        run: |
          pnpm run lint
          pnpm run format:check

      - name: 🧪 Run Build Tests
        run: pnpm run test:build

      - name: 🧩 Run Component Tests
        run: |
          pnpm --filter=@monorepo/ui vitest run
          pnpm --filter=@monorepo/shared vitest run

      - name: 🏗️ Build All Apps
        run: |
          pnpm --filter=@monorepo/trinsler run build
          pnpm --filter=@monorepo/betterclassroom run build
          pnpm --filter=@monorepo/coin-boilerplate-app run build

      - name: 📊 Upload Build Artifacts
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            apps/*/dist
            apps/*/.output
          retention-days: 7

  # Deploy after successful tests
  deploy:
    name: 🚀 Deploy Applications
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🏗️ Build packages
        run: pnpm run build:packages

      - name: 🏗️ Build Coin app for production
        run: pnpm --filter=@monorepo/coin-boilerplate-app run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          NODE_ENV: production
          NUXT_APP_ENV: production

      # Build Trinsler for Development (main branch) or Production (tags)
      - name: 🏗️ Build Trinsler app for development
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter=@monorepo/trinsler run generate
        env:
          NODE_ENV: development
          NUXT_APP_ENV: develop

      - name: 🏗️ Build Trinsler app for production
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter=@monorepo/trinsler run generate
        env:
          NODE_ENV: production
          NUXT_APP_ENV: production

      - name: 🏗️ Build BetterClassroom app for production
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter=@monorepo/betterclassroom run generate
        env:
          NODE_ENV: production
          NUXT_APP_ENV: production

      # Deploy Coin app (always to production)
      - name: 🚀 Deploy Coin app
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/coin
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/coin-boilerplate-app/.output/public
          cname: coin.trinsler.com

      # Deploy Trinsler to Development (main branch)
      - name: 🚀 Deploy Trinsler app to Development
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/trinsler-develop
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/trinsler/.output/public
          cname: trinsler-develop.trinsler.com

      # Deploy Trinsler to Production (tags)
      - name: 🚀 Deploy Trinsler app to Production
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/trinsler
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/trinsler/.output/public
          cname: trinsler.com

      # Deploy BetterClassroom to Production (tags)
      - name: 🚀 Deploy BetterClassroom app to Production
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/betterclassroom
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/betterclassroom/.output/public
          cname: betterclassroom.trinsler.com

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Live URLs:**" >> $GITHUB_STEP_SUMMARY
            echo "- [Coin App](https://coin.trinsler.com)" >> $GITHUB_STEP_SUMMARY

            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "- [Trinsler Dev](https://trinsler-develop.trinsler.com)" >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "- [Trinsler Production](https://trinsler.com)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **Deployment failed!**" >> $GITHUB_STEP_SUMMARY
          fi

