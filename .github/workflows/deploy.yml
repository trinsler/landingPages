name: Deploy Monorepo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm run build:packages || echo "No build:packages script found"

      # Production Build (main branch) - Coin App
      - name: Build Coin app for production
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter=@monorepo/coin-boilerplate-app run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          NODE_ENV: production
          NUXT_APP_ENV: production

      # Production Build (main branch) - Trinsler App
      - name: Build Trinsler app for production
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter=@monorepo/trinsler run generate
        env:
          NODE_ENV: production
          NUXT_APP_ENV: production

      # Development Build (develop branch) - Coin App
      - name: Build Coin app for development
        if: github.ref == 'refs/heads/develop'
        run: pnpm --filter=@monorepo/coin-boilerplate-app run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_DEV }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY_DEV }}
          NODE_ENV: development
          NUXT_APP_ENV: develop

      # Development Build (develop branch) - Trinsler App
      - name: Build Trinsler app for development
        if: github.ref == 'refs/heads/develop'
        run: pnpm --filter=@monorepo/trinsler run generate
        env:
          NODE_ENV: development
          NUXT_APP_ENV: develop

      # Deploy to Production (main branch) - Coin App
      - name: Deploy Coin app to Production
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/coin
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/coin-boilerplate-app/.output/public
          cname: coin.trinsler.com

      # Deploy to Production (main branch) - Trinsler App
      - name: Deploy Trinsler app to Production
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/trinsler
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/trinsler/.output/public
          cname: trinsler.com

      # Deploy to Development (develop branch) - Coin App
      - name: Deploy Coin app to Development
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/coin-develop
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/coin-boilerplate-app/.output/public
          cname: coin-develop.trinsler.com

      # Deploy to Development (develop branch) - Trinsler App
      - name: Deploy Trinsler app to Development
        if: github.ref == 'refs/heads/develop'
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: trinsler/trinsler-develop
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./apps/trinsler/.output/public
          cname: trinsler-develop.trinsler.com