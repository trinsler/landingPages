  build-and-deploy:
    runs-on: ubuntu-latest
    #needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.has-changes == 'true'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    strategy:
      matrix:
        app: ${{ fromJson(format('[{0}]', needs.detect-changes.outputs.changed-apps)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages first
        run: |
          if [ -d "packages" ] && find packages -name "package.json" | grep -q .; then
            echo "Building shared packages..."
            npm run build:packages || echo "No build:packages script found"
          fi

      - name: Check if app exists
        run: |
          if [ ! -d "apps/${{ matrix.app }}" ]; then
            echo "App directory apps/${{ matrix.app }} does not exist"
            exit 1
          fi

          if [ ! -f "apps/${{ matrix.app }}/package.json" ]; then
            echo "No package.json found in apps/${{ matrix.app }}"
            exit 1
          fi

      - name: Build app
        run: |
          echo "Building app: ${{ matrix.app }}"
          cd apps/${{ matrix.app }}

          # Check which build command is available
          if npm run | grep -q "generate"; then
            echo "Using generate command for static site..."
            npm run generate
            BUILD_OUTPUT=".output/public"
          elif npm run | grep -q "build"; then
            echo "Using build command..."
            npm run build
            BUILD_OUTPUT=".output/public"
          else
            echo "No build or generate script found"
            exit 1
          fi

          echo "BUILD_OUTPUT=$BUILD_OUTPUT" >> $GITHUB_ENV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/${{ matrix.app }}/${{ env.BUILD_OUTPUT }}

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-deploy]
    if: always() && needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.build-and-deploy.result }}" = "success" ]; then
            echo "✅ Successfully deployed: ${{ needs.detect-changes.outputs.changed-apps }}"
            echo "🌐 Available at:"
            IFS=',' read -ra APPS <<< "${{ needs.detect-changes.outputs.changed-apps }}"
            for app in "${APPS[@]}"; do
              echo "  - https://$app.dein-domain.com"
            done
          else
            echo "❌ Deployment failed for: ${{ needs.detect-changes.outputs.changed-apps }}"
          fi